<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - Chat App</title>
  <link id="app-favicon" rel="icon" type="image/png" href="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {background-color: #0F1117; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;}
    .register-card {background-color: #1E2230; border-radius: 24px; padding: 32px 24px; max-width: 420px; width: 100%; border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);}
    .icon-box {width: 70px; height: 70px; border-radius: 20px; background: linear-gradient(135deg, #0066FF 0%, #7C3AED 100%); display: flex; align-items: center; justify-content: center;}
    .register-card h2 { font-size: 22px; font-weight: 700; text-align: center; }
    .register-card p { color: #94A3B8; font-size: 13px; text-align: center; margin-top: -12px; }
    .input-group {width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left;}
    .input-group label { font-size: 12px; font-weight: 600; color: #94A3B8; }
    .input-wrapper {position: relative; display: flex; align-items: center; min-height: 44px;}
    .input-wrapper > svg:first-child {position: absolute; left: 14px; stroke: #94A3B8;}
    .input-wrapper input {width: 100%; background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px 14px 12px 42px; color: #FFFFFF; font-size: 14px; outline: none; font-family: inherit;}
    .input-wrapper input:focus {border-color: #0066FF;}
    .btn-register {width: 100%; background: linear-gradient(135deg, #0066FF 0%, #7C3AED 100%); color: #FFFFFF; border: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px;}
    .login-box {margin-top: 10px; font-size: 13px; color: #94A3B8; text-align: center;}
    .login-box a {color: #0066FF; font-weight: 600; text-decoration: none;}
    .login-box a:hover {text-decoration: underline;}
    .btn-back {background: none; border: none; color: #94A3B8; font-size: 12px; cursor: pointer; text-decoration: none;}
    .btn-back:hover {color: #FFFFFF; text-decoration: underline;}
    .hidden { display: none !important; }
    .checkbox-group {display: flex; align-items: center; gap: 10px; margin-top: 4px; margin-bottom: 4px;}
    .checkbox-group input[type="checkbox"] {width: 18px; height: 18px; accent-color: #0066FF; cursor: pointer;}
    .checkbox-group label {font-size: 12px; color: #94A3B8; cursor: pointer; line-height: 1.4;}
    .checkbox-group label a {color: #0066FF; text-decoration: none;}
    .checkbox-group label a:hover {text-decoration: underline;}
    .spinner-icon {position: absolute; right: 14px; width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.2); border-top-color: #0066FF; border-radius: 50%; animation: spin 0.8s linear infinite;}
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-msg { font-size: 11px; margin-top: 4px; font-weight: 600; display: block; }
    .status-msg.error { color: #FF4D4D; }
    .status-msg.success { color: #10B981; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-box { background: #1E2230; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 28px; width: 90%; max-width: 360px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5); }
    .modal-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .modal-icon.success { background: rgba(16, 185, 129, 0.15); stroke: #10B981; }
    .modal-icon.error { background: rgba(255, 77, 77, 0.15); stroke: #FF4D4D; }
    .modal-box h3 { font-size: 18px; font-weight: 700; color: #FFFFFF; }
    .modal-box p { font-size: 13px; color: #94A3B8; line-height: 1.4; }
    .btn-modal { width: 100%; background: linear-gradient(135deg, #0066FF 0%, #7C3AED 100%); color: #FFFFFF; border: none; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 6px; }
    #loading-screen {position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(15, 17, 23, 0.85); backdrop-filter: blur(8px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; gap: 16px;}
    .astro-box {width: 130px; height: 130px; animation: floatAstro 2.5s ease-in-out infinite;}
    .loading-text {color: #94A3B8; font-size: 14px; font-weight: 600; letter-spacing: 0.5px;}
    @keyframes floatAstro {0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-15px) rotate(3deg); } }

    /* OLHINHO DO CAMPO DE SENHA */
    .btn-olho-senha-cadastro-unico{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px;border-radius:6px;z-index:2}
    .btn-olho-senha-cadastro-unico:active{opacity:0.7}
    .btn-olho-senha-cadastro-unico svg{position:static !important;left:auto !important;stroke:#94A3B8}
    #input-password{padding-right:44px !important}
    
</style>

</head>
<body>

    <!-- ETAPA 1 -->
    <!-- FORMULÁRIO DE CADASTRO ÚNICO -->
 <form id="cadastroForm" style="width: 100%; display: flex; flex-direction: column; gap: 14px;" onsubmit="criarContaUnica(event)">

      <div class="input-group">

      <div class="input-group">

          <input type="password" id="input-password" placeholder="••••••••" required>

            <span id="iconeOlhoSenhaCadastroUnico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
          </button>
        </div>
      </div>

      <div class="input-group">
        <label>Número de Telefone</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          <input type="tel" id="input-phone" placeholder="(00) 00000-0000" maxlength="15" oninput="mascaraTelefone(this); validarFormulario();" required>
        </div>
      </div>

      <div class="input-group">
        <label>Data de Nascimento</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <input type="text" id="input-birth" placeholder="DD/MM/AAAA" maxlength="10" oninput="mascaraData(this); validarFormulario();" required>
        </div>

      <!-- Checkbox Termos e Políticas -->
      <div class="checkbox-group">
        <input type="checkbox" id="terms" onchange="validarFormulario()">
        <label for="terms">
          Li e concordo com os <a href="termosdeuso.html" target="_blank">Termos de Uso</a> e <a href="politicasdeprivacidade.html" target="_blank">Políticas de Privacidade</a>.
        </label>
      </div>

      <button type="submit" id="btn-finalizar" class="btn-register" disabled style="opacity: 0.5; cursor: not-allowed;">Criar Conta</button>

    <div class="login-box">
      Já tem uma conta? <a href="login.html">Fazer login</a>
    </div>

    <button class="btn-back" onclick="window.location.href='inicio.html'">Voltar para o Feed sem login</button>
  </div>

  <!-- POPUP MODAL PROFISSIONAL -->
 <div id="custom-modal" class="modal-overlay hidden">
   <div class="modal-box">

       <svg id="modal-svg-error" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="hidden"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>

 </div>

 <!-- SPLASH DE CARREGAMENTO - CRIANDO CONTA -->
   <div id="loading-screen">
    <div class="astro-box">

        <path d="M 60 145 Q 40 160 50 175 Q 70 165 75 145 Z" fill="#FF3B30" />

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


      const firebaseConfig = {
        apiKey: "AIzaSyDcX15UtgqteHH0MhCCZjZBbJkKNaoB61U",
        authDomain: "lobbz-a2e5b.firebaseapp.com",
        projectId: "lobbz-a2e5b",
        storageBucket: "lobbz-a2e5b.firebasestorage.app",
        messagingSenderId: "54068991558",
        appId: "1:54068991558:web:c4ccbe7ac3d53de0d80e07"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      window.db = db;

      //================================================
      //    ETAPA 1: CRIAR CONTA E SALVAR
      //================================================
      let acaoAposModal = null;

   function mostrarModal(titulo, mensagem, tipo, acao = null) {
     const modal = document.getElementById('custom-modal');
     const iconContainer = document.getElementById('modal-icon-container');
     const svgSuccess = document.getElementById('modal-svg-success');
     const svgError = document.getElementById('modal-svg-error');
     const titleEl = document.getElementById('modal-title');
     const msgEl = document.getElementById('modal-message');

     titleEl.textContent = titulo;
     msgEl.textContent = mensagem;
     acaoAposModal = acao;

     if (tipo === 'success') {
       iconContainer.className = "modal-icon success";
       svgSuccess.classList.remove('hidden');
       svgError.classList.add('hidden');
     } else {
       iconContainer.className = "modal-icon error";
       svgSuccess.classList.add('hidden');
       svgError.classList.remove('hidden');
     }

     modal.classList.remove('hidden');
   }

   function fecharModal() {
     document.getElementById('custom-modal').classList.add('hidden');
     if (acaoAposModal) {
       acaoAposModal();
     }
   }

   async function criarContaUnica(event) {
     event.preventDefault();
     document.getElementById('loading-screen').style.display = 'flex';

     const nome = document.getElementById('nomeCompleto').value.trim();
     const username = document.getElementById('input-username').value.trim().toLowerCase();
     const email = document.getElementById('input-email').value.trim();
     const senha = document.getElementById('input-password').value;
     const telefone = document.getElementById('input-phone').value.trim();
     const dataNasc = document.getElementById('input-birth').value.trim();
     const loader = document.getElementById('loading-username');

     try {
       loader.classList.remove('hidden');

       const userQuery = query(collection(db, "usuarios"), where("nomeUsuario", "==", username));
       const querySnapshot = await getDocs(userQuery);

       if (!querySnapshot.empty) {
         loader.classList.add('hidden');
         mostrarModal("Usuário Indisponível", "Este nome de usuário já está em uso. Escolha outro.", "error");
         return;
       }

       const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
       const user = userCredential.user;
       await sendEmailVerification(user);

       await setDoc(doc(db, "usuarios", user.uid), {
         nomeCompleto: nome,
         nomeUsuario: username,
         email: email,
         telefone: telefone,
         dataNascimento: dataNasc,
         termosAceitos: true,
         saldoMoedas: 0,
         cadastroConcluido: true,
         criadoEm: new Date().toISOString()
       });
        document.getElementById('loading-screen').style.display = 'none';
       loader.classList.add('hidden');
       mostrarModal(
         "Cadastro Realizado!", 
         "Enviamos um e-mail de verificação para o seu endereço de e-mail cadastrado. Se não recebeu verifique a sua caixa de SPAM!", 
         "success", 
         () => { window.location.href = 'login.html'; }
       );
     } catch (error) {
      document.getElementById('loading-screen').style.display = 'none';
       loader.classList.add('hidden');
       if (error.code === 'auth/email-already-in-use') {
         mostrarModal("E-mail Já Cadastrado", "Este e-mail já está em uso. Tente fazer login.", "error");
       } else {
         mostrarModal("Erro no Cadastro", error.message, "error");
       }
     }
   }

      function mascaraTelefone(input) {
        let value = input.value.replace(/\D/g, "");
        if (value.length > 11) value = value.slice(0, 11);
        value = value.replace(/^(\d{2})(\d)/g, "($1) $2");
        value = value.replace(/(\d)(\d{4})$/, "$1-$2");
        input.value = value;
      }

      function mascaraData(input) {
        let value = input.value.replace(/\D/g, "");
        if (value.length > 8) value = value.slice(0, 8);
        value = value.replace(/(\d{2})(\d)/, "$1/$2");
        value = value.replace(/(\d{2})(\d)/, "$1/$2");
        input.value = value;
      }

      //  FUNÇÃO DE BUSCAR SE USUARIO JÁ EXISTE
    let usernameTimeout = null;
    let usernameValido = false;

   function checarUsernameLive() {
     clearTimeout(usernameTimeout);
     const usernameInput = document.getElementById('input-username');
     const username = usernameInput.value.trim().toLowerCase();
     const loader = document.getElementById('loading-username');
     const msg = document.getElementById('username-msg');
     const checkIcon = document.getElementById('icon-username-check');

     msg.classList.add('hidden');
     if (checkIcon) checkIcon.classList.add('hidden');
     usernameValido = false;
     validarFormulario();

     if (username.length === 0) {
       loader.classList.add('hidden');
       return;
     }

     const regexPermitido = /^[a-z0-9._]+$/;
     if (!regexPermitido.test(username)) {
       loader.classList.add('hidden');
       msg.textContent = "Os nomes de usuário só podem incluir letras, números, pontos e sublinhados.";
       msg.className = "status-msg error";
       msg.classList.remove('hidden');
       return;
     }

     if (username.length < 3) {
       loader.classList.add('hidden');
       return;
     }

     loader.classList.remove('hidden');

     usernameTimeout = setTimeout(async () => {
       try {
         const userQuery = query(collection(db, "usuarios"), where("nomeUsuario", "==", username));
         const querySnapshot = await getDocs(userQuery);

         loader.classList.add('hidden');

         if (!querySnapshot.empty) {
           msg.textContent = "Este nome de usuário já está em uso.";
           msg.className = "status-msg error";
           msg.classList.remove('hidden');
           usernameValido = false;
         } else {
           msg.classList.add('hidden');
           if (checkIcon) checkIcon.classList.remove('hidden');
           usernameValido = true;
         }
       } catch (err) {
         loader.classList.add('hidden');
       }
       validarFormulario();
     }, 500);
   }

   function validarFormulario() {
     const phone = document.getElementById('input-phone').value.trim();
     const birth = document.getElementById('input-birth').value.trim();
     const terms = document.getElementById('terms') ? document.getElementById('terms').checked : false;
     const btn = document.getElementById('btn-finalizar');

     if (!btn) return;

     const phoneValido = phone.length >= 14;
     const birthValida = birth.length === 10;

     if (phoneValido && birthValida && terms && usernameValido) {
       btn.disabled = false;
       btn.style.opacity = "1";
       btn.style.cursor = "pointer";
     } else {
       btn.disabled = true;
       btn.style.opacity = "0.5";
       btn.style.cursor = "not-allowed";
     }
   }

   //=======================================
   //   FUNÇÃO DO OLHINHO NO CAMPO DA SENHA
   //=======================================
      window.alternarVisibilidadeSenhaCadastroUnico = function(){
     const inputSenhaOlhoCadastroUnico = document.getElementById('input-password');
