    let estadoSeguindoAssistirUnico = false;
    let uidDonoGlobalAssistirUnico = null;
async function seguirCanalAssistirUnico(){
  const botaoSeguirAssistirUnico = document.getElementById('btn-seguir-assistir-unico');
  const usuarioLogadoSeguirUnico = authAssistirUnico.currentUser;
  if(!usuarioLogadoSeguirUnico){ window.location.href = 'login.html'; return; }
  const uidLogadoSeguirUnico = usuarioLogadoSeguirUnico.uid;
  const uidDonoSeguirUnico = uidDonoGlobalAssistirUnico;
  if(!uidDonoSeguirUnico){ alert('Dono não carregado ainda'); return; }
  if(uidLogadoSeguirUnico === uidDonoSeguirUnico){ alert('Não pode seguir seu próprio canal'); return; }
  try{
    botaoSeguirAssistirUnico.disabled = true;
    const refSeguidorDocUnico = dbAssistirUnico.collection('canais').doc(uidDonoSeguirUnico).collection('seguidores').doc(uidLogadoSeguirUnico);
    const refCanalContadorUnico = dbAssistirUnico.collection('canais').doc(uidDonoSeguirUnico);
    if(estadoSeguindoAssistirUnico){
      await refSeguidorDocUnico.delete();
      await refCanalContadorUnico.set({ inscritos: firebase.firestore.FieldValue.increment(-1) }, { merge: true });
      estadoSeguindoAssistirUnico = false;
    } else {
      await refSeguidorDocUnico.set({ uid: uidLogadoSeguirUnico, seguidoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      await refCanalContadorUnico.set({ inscritos: firebase.firestore.FieldValue.increment(1) }, { merge: true });
      estadoSeguindoAssistirUnico = true;
    }
    renderBotaoSeguirLogadoAssistirUnico();
  } catch(erroSeguirUnico){
    alert('Erro seguir: ' + erroSeguirUnico.message);
    console.log('Erro seguir', erroSeguirUnico);
  } finally {
    botaoSeguirAssistirUnico.disabled = false;
  }
}

const svgIconeSeguirBrancoAssistirUnico = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>';

function renderBotaoFazerLoginDeslogadoAssistirUnico(){
  const botaoSeguirRenderLoginAssistirUnico = document.getElementById('btn-seguir-assistir-unico');
  botaoSeguirRenderLoginAssistirUnico.classList.remove('seguindo-assistir-unico');

function renderBotaoSeguirLogadoAssistirUnico(){
  const botaoSeguirRenderLogadoAssistirUnico = document.getElementById('btn-seguir-assistir-unico');
  if(estadoSeguindoAssistirUnico){
    botaoSeguirRenderLogadoAssistirUnico.classList.add('seguindo-assistir-unico');
    botaoSeguirRenderLogadoAssistirUnico.innerHTML = svgIconeSeguindoCheckAssistirUnico + ' Seguindo';

    botaoSeguirRenderLogadoAssistirUnico.classList.remove('seguindo-assistir-unico');
    botaoSeguirRenderLogadoAssistirUnico.innerHTML = svgIconeSeguirBrancoAssistirUnico + ' Seguir';
  }
  botaoSeguirRenderLogadoAssistirUnico.onclick = seguirCanalAssistirUnico;
}

async function verificarSeSegueAssistirUnico(uidLogadoVerifUnico, uidDonoVerifUnico){
  const refVerifSeguirUnico = dbAssistirUnico.collection('canais').doc(uidDonoVerifUnico).collection('seguidores').doc(uidLogadoVerifUnico);
  const docVerifSeguirUnico = await refVerifSeguirUnico.get();
  estadoSeguindoAssistirUnico = docVerifSeguirUnico.exists;
  renderBotaoSeguirLogadoAssistirUnico();
}

function gerenciarEstadoAutenticacaoSeguirAssistirUnico(){
  authAssistirUnico.onAuthStateChanged(async function(usuarioLogadoAssistirUnico){
    const botaoSeguirOcultarProprioUnico = document.getElementById('btn-seguir-assistir-unico');
    const avatarComentarUnico = document.getElementById('avatar-comentar-assistir-unico');
    if(usuarioLogadoAssistirUnico){
      const fotoAuthUnico = usuarioLogadoAssistirUnico.photoURL;
      const nomeAuthUnico = usuarioLogadoAssistirUnico.displayName;
      let inicialAuthUnico = 'U';
      if(nomeAuthUnico){
        inicialAuthUnico = nomeAuthUnico.charAt(0).toUpperCase();
      }
      if(fotoAuthUnico){
        avatarComentarUnico.innerHTML = '<img src="' + fotoAuthUnico + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
      } else {
        try{
          const storageFotoUnico = firebase.storage();
          const caminhoFotoUnico = 'usuarios/' + usuarioLogadoAssistirUnico.uid;
          console.log('Buscando foto Storage em:', caminhoFotoUnico);
          const pastaUsuarioFotoUnico = storageFotoUnico.ref(caminhoFotoUnico);
          const listaArquivosFotoUnico = await pastaUsuarioFotoUnico.listAll();
          console.log('Arquivos achados:', listaArquivosFotoUnico.items.length);
          if(listaArquivosFotoUnico.items.length > 0){
            const primeiraFotoUnico = listaArquivosFotoUnico.items[0];
            const urlFotoStorageUnico = await primeiraFotoUnico.getDownloadURL();
            console.log('URL foto:', urlFotoStorageUnico);
            avatarComentarUnico.innerHTML = '<img src="' + urlFotoStorageUnico + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
          } else {
            avatarComentarUnico.innerText = inicialAuthUnico;
            avatarComentarUnico.style.display = 'flex';
            avatarComentarUnico.style.alignItems = 'center';
            avatarComentarUnico.style.justifyContent = 'center';
            avatarComentarUnico.style.color = '#FFF';
            avatarComentarUnico.style.fontWeight = '700';
          }
        }catch(erroFotoUnico){
          console.log('Erro Storage avatar:', erroFotoUnico);
          avatarComentarUnico.innerText = inicialAuthUnico;

      } else {
        renderBotaoSeguirLogadoAssistirUnico();

    function formatarSeguidoresAssistirUnico(qtdSeguidoresFormatUnico){
    const qtdFormatUnico = Number(qtdSeguidoresFormatUnico) || 0;
    if(qtdFormatUnico === 0){ return '0 seguidores'; }
    if(qtdFormatUnico === 1){ return '1 seguidor'; }
    if(qtdFormatUnico < 1000){ return qtdFormatUnico + ' seguidores'; }
    if(qtdFormatUnico < 1000000){
      const milFormatUnico = (qtdFormatUnico / 1000).toFixed(1).replace('.0','');
      return milFormatUnico + ' mil seguidores';
    }
    const miFormatUnico = (qtdFormatUnico / 1000000).toFixed(1).replace('.0','');
    return miFormatUnico + ' mi seguidores';
  }
  function escutarInscritosAssistirUnico(uidDonoEscutaUnico){
    const handleElementoEscutaUnico = document.getElementById('handle-canal-assistir-unico');
    dbAssistirUnico.collection('canais').doc(uidDonoEscutaUnico).onSnapshot(function(docEscutaUnico){
      if(docEscutaUnico.exists){
        const dadosEscutaUnico = docEscutaUnico.data();

  //========================================
  //   FUNÇÃO DE CALCULAR A DATA QUE O VÍDEO FOI POSTADO
  //========================================
    function calcularTempoPostagemYouTubeAssistirUnico(timestampCriadoEmAssistirUnico){
    let dataCriacaoAssistirUnico;
    if(!timestampCriadoEmAssistirUnico){ return 'hoje'; }
    if(timestampCriadoEmAssistirUnico.toDate){ dataCriacaoAssistirUnico = timestampCriadoEmAssistirUnico.toDate(); }
    else if(timestampCriadoEmAssistirUnico.seconds){ dataCriacaoAssistirUnico = new Date(timestampCriadoEmAssistirUnico.seconds * 1000); }
    else { dataCriacaoAssistirUnico = new Date(timestampCriadoEmAssistirUnico); }
    const agoraAssistirUnico = new Date();
    const diffMsAssistirUnico = agoraAssistirUnico - dataCriacaoAssistirUnico;
    const diffDiasAssistirUnico = Math.floor(diffMsAssistirUnico / (1000 * 60 * 60 * 24));
    if(diffDiasAssistirUnico <= 0){ return 'hoje'; }
    if(diffDiasAssistirUnico === 1){ return 'ontem'; }
    if(diffDiasAssistirUnico < 30){ return `há ${diffDiasAssistirUnico} dias`; }
    if(diffDiasAssistirUnico < 60){ return 'há 1 mês'; }
    if(diffDiasAssistirUnico < 365){
      const mesesAssistirUnico = Math.floor(diffDiasAssistirUnico / 30);
      return `há ${mesesAssistirUnico} meses`;
    }
    const anosAssistirUnico = Math.floor(diffDiasAssistirUnico / 365);
    if(anosAssistirUnico === 1){ return 'há 1 ano'; }
    return `há ${anosAssistirUnico} anos`;
  }

  //===================================
  //   FUNÇÃO DE MOSTRAR HORARIO DOS COMENTARIOS
  //===================================
    function formatarTempoRelativoComentarioUnico(timestampComentarioUnico){
    if(!timestampComentarioUnico) return 'agora';
    const agoraTempoUnico = Date.now();
    const diferencaTempoUnico = agoraTempoUnico - timestampComentarioUnico;
    const segundosTempoUnico = Math.floor(diferencaTempoUnico / 1000);
    if(segundosTempoUnico < 60) return 'agora';
    const minutosTempoUnico = Math.floor(segundosTempoUnico / 60);
    if(minutosTempoUnico < 60) return minutosTempoUnico + 'm';
    const horasTempoUnico = Math.floor(minutosTempoUnico / 60);
    if(horasTempoUnico < 24) return horasTempoUnico + 'h';
    const diasTempoUnico = Math.floor(horasTempoUnico / 24);
    return diasTempoUnico + 'd';
  }

    function iniciarComentariosRealtimeAssistirUnico(idLiveComentarioUnico){

        if(!dadosComentarioUnico) return;

         if(!textoComentarioUnico){

        let inicialComentarioUnico = 'U';
        if(nomeComentarioUnico){
          inicialComentarioUnico = nomeComentarioUnico.charAt(0).toUpperCase();
        }
        let avatarHtmlComentarioUnico = '<div style="width:32px;height:32px;border-radius:50%;background:#0F1117;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#FFF;">' + inicialComentarioUnico + '</div>';
        if(fotoComentarioUnico){
          avatarHtmlComentarioUnico = '<div style="width:32px;height:32px;border-radius:50%;background:#0F1117;flex-shrink:0;overflow:hidden;"><img src="' + fotoComentarioUnico + '" style="width:100%;height:100%;object-fit:cover;"></div>';

        let nomeHtmlComentarioUnico = '';
        if(nomeComentarioUnico){
          nomeHtmlComentarioUnico = '<span style="font-weight:700;color:#FFF;font-size:13px;">' + nomeComentarioUnico + '</span>';
        }
        const itemComentarioUnico = document.createElement('div');
        itemComentarioUnico.style.display = 'flex';
        itemComentarioUnico.style.gap = '8px';
        itemComentarioUnico.style.alignItems = 'flex-start';
        itemComentarioUnico.innerHTML = avatarHtmlComentarioUnico + '<div style="flex:1;"><div style="display:flex;gap:6px;align-items:center;">' + nomeHtmlComentarioUnico + '<span style="font-size:11px;color:#94A3B8;">' + textoTempoComentarioUnico + '</span></div><div style="color:#94A3B8;font-size:13px;margin-top:2px;white-space:pre-wrap;">' + textoComentarioUnico + '</div></div>';
        listaComentariosUnico.insertBefore(itemComentarioUnico, listaComentariosUnico.firstChild);
        listaComentariosUnico.scrollTop = 0;
        contadorComentariosUnico++;
        qtdComentariosUnico.innerText = contadorComentariosUnico;
      });
    }

  async function enviarComentarioRealtimeAssistirUnico(){
    const inputComentarioEnviarUnico = document.getElementById('input-comentario-assistir-unico');
    const textoComentarioEnviarUnico = inputComentarioEnviarUnico.value.trim();
    if(!textoComentarioEnviarUnico) return;

    const idLiveComentarioEnviarUnico = urlParamsComentarioEnviarUnico.get('live');
    const databaseEnviarUnico = firebase.database();
    const refEnviarUnico = databaseEnviarUnico.ref('live_chat/' + idLiveComentarioEnviarUnico + '/comentarios');
    let nomeEnviarUnico = usuarioAtualComentarioEnviarUnico.displayName;
    if(!nomeEnviarUnico){
      try{
        const docNomeUsuarioUnico = await dbAssistirUnico.collection('usuarios').doc(usuarioAtualComentarioEnviarUnico.uid).get();
        if(docNomeUsuarioUnico.exists){
          const dadosNomeUsuarioUnico = docNomeUsuarioUnico.data();

          if(!nomeEnviarUnico){

          }

            nomeEnviarUnico = dadosNomeUsuarioUnico.nomeCanal;
          }
          if(!nomeEnviarUnico){
            nomeEnviarUnico = dadosNomeUsuarioUnico.name;
          }
        }
      }catch(erroNomeUnico){
        console.log('Erro buscar nome usuarios:', erroNomeUnico);
      }
    }
    if(!nomeEnviarUnico){
      try{
        const docNomeUsuarioSingularUnico = await dbAssistirUnico.collection('usuario').doc(usuarioAtualComentarioEnviarUnico.uid).get();
        if(docNomeUsuarioSingularUnico.exists){
          const dadosNomeUsuarioSingularUnico = docNomeUsuarioSingularUnico.data();
          nomeEnviarUnico = dadosNomeUsuarioSingularUnico.nomeUsuario;
          if(!nomeEnviarUnico){
            nomeEnviarUnico = dadosNomeUsuarioSingularUnico.nome;
          }
          if(!nomeEnviarUnico){
            nomeEnviarUnico = dadosNomeUsuarioSingularUnico.nomeCanal;
          }
        }
      }catch(erroNomeSingularUnico){
        console.log('Erro buscar nome usuario:', erroNomeSingularUnico);
      }
    }
    if(!nomeEnviarUnico){
      nomeEnviarUnico = 'Usuário';
    }
    let fotoEnviarUnico = usuarioAtualComentarioEnviarUnico.photoURL;
    if(!fotoEnviarUnico){
      try{
        const storageEnviarUnico = firebase.storage();
        const caminhoEnviarUnico = 'usuarios/' + usuarioAtualComentarioEnviarUnico.uid;
        const pastaEnviarUnico = storageEnviarUnico.ref(caminhoEnviarUnico);
        const listaEnviarUnico = await pastaEnviarUnico.listAll();
        console.log('Enviar - arquivos achados:', listaEnviarUnico.items.length);
        if(listaEnviarUnico.items.length > 0){
          const arquivoEnviarUnico = listaEnviarUnico.items[0];
          fotoEnviarUnico = await arquivoEnviarUnico.getDownloadURL();
          console.log('Enviar - URL foto:', fotoEnviarUnico);
        }
      }catch(erroEnviarUnico){
        console.log('Erro Storage enviar:', erroEnviarUnico);
      }
    }
    if(!fotoEnviarUnico){
      fotoEnviarUnico = '';
    }
    refEnviarUnico.push({
      uid: usuarioAtualComentarioEnviarUnico.uid,
      nome: nomeEnviarUnico,
      foto: fotoEnviarUnico,
      texto: textoComentarioEnviarUnico,
      criadoEm: firebase.database.ServerValue.TIMESTAMP
    });
    inputComentarioEnviarUnico.value = '';
  }

  //===============================================
  //     FUNÇÃO DE ASSISTIR LIVE AO VIVO
  //===============================================
    async function iniciarViewerAgoraAssistirUnico(canalAgoraViewerUnico){
    const divVideoAgoraViewerUnico = document.getElementById('video-assistir-agora-pro');
    const thumbViewerUnico = document.getElementById('thumb-assistir-unico');
    const placeholderViewerUnico = document.getElementById('placeholder-assistir-unico');
    if(divVideoAgoraViewerUnico){ divVideoAgoraViewerUnico.style.display = 'block'; }
    if(thumbViewerUnico){ thumbViewerUnico.style.display = 'none'; }
    if(placeholderViewerUnico){ placeholderViewerUnico.style.display = 'none'; }
    clienteAgoraAssistirUnico = AgoraRTC.createClient({ mode: 'live', codec: 'h264' });
    await clienteAgoraAssistirUnico.setClientRole('audience');
    clienteAgoraAssistirUnico.on('user-published', async (userAgoraViewerUnico, mediaTypeViewerUnico) => {
      await clienteAgoraAssistirUnico.subscribe(userAgoraViewerUnico, mediaTypeViewerUnico);
      if(mediaTypeViewerUnico === 'video'){
        userAgoraViewerUnico.videoTrack.play('video-assistir-agora-pro');
      }
      if(mediaTypeViewerUnico === 'audio'){
        userAgoraViewerUnico.audioTrack.play();
      }
    });
    await clienteAgoraAssistirUnico.join(appIdAgoraAssistirUnico, canalAgoraViewerUnico, tokenAgoraAssistirUnico, null);
  }
