<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistir - Chat App</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0F1117;color:#FFF;font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;min-height:100vh}
.header-assistir{position:sticky;top:0;z-index:10;background:#1E2230;border-bottom:1px solid rgba(255,255,255,0.08);padding:12px 16px;display:flex;align-items:center;gap:12px}
.video-container{width:100%;max-width:900px;margin:0 auto;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
.video-container img,.video-container video{width:100%;height:100%;object-fit:cover}
.badge-assistir{position:absolute;top:12px;left:12px;background:#FF2D55;color:#FFF;font-size:11px;font-weight:700;padding:6px 10px;border-radius:6px;display:flex;align-items:center;gap:6px}
.info-assistir{width:100%;max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.titulo-assistir{font-size:18px;font-weight:700;line-height:1.3}
.canal-assistir{display:flex;align-items:center;gap:12px;padding:12px;background:#1E2230;border:1px solid rgba(255,255,255,0.08);border-radius:16px}
.avatar-assistir{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#0066FF 0%,#7C3AED 100%);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
.desc-assistir{font-size:13px;color:#94A3B8;background:#1E2230;border:1px solid rgba(255,255,255,0.05);border-radius:12px;padding:12px;white-space:pre-wrap}
.btn-voltar-assistir{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer}


.canal-assistir{justify-content:space-between}
.canal-esquerda-assistir-unico{display:flex;align-items:center;gap:12px}
.btn-seguir-assistir-unico{margin-left:auto;background:linear-gradient(135deg,#0066FF 0%,#7C3AED 100%);color:#FFF;border:none;padding:10px 18px;border-radius:24px;font-weight:700;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;flex-shrink:0;transition:opacity 0.2s}
.btn-seguir-assistir-unico:active{opacity:0.8}
.btn-seguir-assistir-unico.seguindo-assistir-unico{background:#1E2230;border:1px solid rgba(255,255,255,0.08);color:#94A3B8}
.acoes-assistir-unico{width:100%;max-width:900px;margin:0 auto;padding:0 16px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.acoes-assistir-unico::-webkit-scrollbar{display:none}
.btn-acao-assistir-unico{background:#1E2230;border:1px solid rgba(255,255,255,0.08);color:#FFF;padding:9px 16px;border-radius:24px;font-weight:600;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.btn-acao-assistir-unico:active{background:#0F1117}

.titulo-assistir{font-size:20px;line-height:1.25;letter-spacing:-0.2px}
.info-assistir{gap:14px}
.meta-views-assistir-unico{font-size:13px;color:#94A3B8;display:flex;align-items:center;gap:8px;font-weight:600}
.meta-views-assistir-unico span{width:3px;height:3px;background:#94A3B8;border-radius:50%;display:inline-block}
.desc-assistir{line-height:1.5;cursor:pointer;transition:background 0.2s}
.acoes-assistir-unico{width:100%;padding:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;justify-content:flex-start}
.btn-acao-assistir-unico{background:#1E2230;border:1px solid rgba(255,255,255,0.08)}
.btn-acao-assistir-unico svg{flex-shrink:0}

</style>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="header-assistir">
  <div class="btn-voltar-assistir" onclick="voltarInicioAssistirUnico()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
  </div>
  <span style="font-weight:700;">Assistir</span>
</div>

<div class="video-container" id="container-video-assistir">
  <img id="thumb-assistir-unico" style="display:none;" alt="">
  <div id="placeholder-assistir-unico" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0066FF 0%,#7C3AED 100%);">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
  </div>
  <div id="badge-status-assistir" class="badge-assistir" style="display:none;"></div>
</div>

<div class="info-assistir">
  <h1 id="titulo-assistir-unico" class="titulo-assistir">Carregando...</h1>
    <div id="meta-views-assistir-unico" class="meta-views-assistir-unico">0 visualizações <span></span> hoje</div>
  <div class="canal-assistir">
    <div class="canal-esquerda-assistir-unico">
      <div id="avatar-canal-assistir-unico" class="avatar-assistir">C</div>
      <div style="display:flex;flex-direction:column;">
        <span id="nome-canal-assistir-unico" style="font-weight:700;font-size:14px;">Canal</span>
        <span id="handle-canal-assistir-unico" style="font-size:12px;color:#94A3B8;">@canal</span>
      </div>
    </div>
    <button id="btn-seguir-assistir-unico" class="btn-seguir-assistir-unico" onclick="seguirCanalAssistirUnico()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
      Seguir
    </button>
  </div>

  <div class="acoes-assistir-unico">
    <button class="btn-acao-assistir-unico" onclick="curtirVideoAssistirUnico()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
      <span id="contador-like-assistir-unico">Curtir</span>
    </button>
    <button class="btn-acao-assistir-unico" onclick="compartilharVideoAssistirUnico()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      Compartilhar
    </button>
    <button class="btn-acao-assistir-unico" onclick="salvarVideoAssistirUnico()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      Salvar
    </button>
  </div>

  <div id="descricao-assistir-unico" class="desc-assistir">Descrição...</div>

</div>

<script>
  const firebaseConfigAssistirUnico = {
    apiKey: "AIzaSyDcX15UtgqteHH0MhCCZjZBbJkKNaoB61U",
    authDomain: "lobbz-a2e5b.firebaseapp.com",
    databaseURL: "https://lobbz-a2e5b-default-rtdb.firebaseio.com",
    projectId: "lobbz-a2e5b",
    storageBucket: "lobbz-a2e5b.firebasestorage.app",
    messagingSenderId: "540689991558",
    appId: "1:540689991558:web:c4ccbe7ac3d53de0d80e07"
  };
  const appAssistirUnico = firebase.initializeApp(firebaseConfigAssistirUnico);
  const dbAssistirUnico = firebase.firestore();

  function voltarInicioAssistirUnico(){
    window.location.href = 'inicio.html';
  }

    let estadoSeguindoAssistirUnico = false;
  function seguirCanalAssistirUnico(){
    const botaoSeguirAssistirUnico = document.getElementById('btn-seguir-assistir-unico');
    estadoSeguindoAssistirUnico = !estadoSeguindoAssistirUnico;
    if(estadoSeguindoAssistirUnico){
      botaoSeguirAssistirUnico.classList.add('seguindo-assistir-unico');
      botaoSeguirAssistirUnico.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><path d="M20 6L9 17l-5-5"></path></svg> Seguindo';
    } else {
      botaoSeguirAssistirUnico.classList.remove('seguindo-assistir-unico');
      botaoSeguirAssistirUnico.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg> Seguir';
    }
  }
  function compartilharVideoAssistirUnico(){
    const urlCompartilharAssistirUnico = window.location.href;
    if(navigator.share){
      navigator.share({title:document.getElementById('titulo-assistir-unico').innerText, url:urlCompartilharAssistirUnico});
    } else {
      navigator.clipboard.writeText(urlCompartilharAssistirUnico);
      alert('Link copiado: ' + urlCompartilharAssistirUnico);
    }
  }
  function curtirVideoAssistirUnico(){
    const contadorLikeAssistirUnico = document.getElementById('contador-like-assistir-unico');
    contadorLikeAssistirUnico.innerText = 'Curtido';
  }
  function salvarVideoAssistirUnico(){
    alert('Vídeo salvo');
  }

  async function carregarVideoAssistirUnico(){
    const paramsAssistirUnico = new URLSearchParams(window.location.search);
    const idLiveAssistirUnico = paramsAssistirUnico.get('live');
    const uidDonoAssistirUnico = paramsAssistirUnico.get('uid');
    const tituloElementoAssistirUnico = document.getElementById('titulo-assistir-unico');
    const thumbElementoAssistirUnico = document.getElementById('thumb-assistir-unico');
    const placeholderElementoAssistirUnico = document.getElementById('placeholder-assistir-unico');
    const badgeElementoAssistirUnico = document.getElementById('badge-status-assistir');
    const nomeCanalElementoAssistirUnico = document.getElementById('nome-canal-assistir-unico');
    const avatarCanalElementoAssistirUnico = document.getElementById('avatar-canal-assistir-unico');
    const descElementoAssistirUnico = document.getElementById('descricao-assistir-unico');
    if(!idLiveAssistirUnico || !uidDonoAssistirUnico){ tituloElementoAssistirUnico.innerText = 'Vídeo não encontrado'; return; }
    try{
      const docLiveAssistirUnico = await dbAssistirUnico.collection('canais').doc(uidDonoAssistirUnico).collection('lives').doc(idLiveAssistirUnico).get();
      if(!docLiveAssistirUnico.exists){ tituloElementoAssistirUnico.innerText = 'Vídeo não encontrado'; return; }
      const dadosLiveAssistirUnico = docLiveAssistirUnico.data();
      const tituloLiveAssistirUnico = dadosLiveAssistirUnico.titulo || 'Sem título';
      const descricaoLiveAssistirUnico = dadosLiveAssistirUnico.descricao || 'Sem descrição';
      const thumbLiveAssistirUnico = dadosLiveAssistirUnico.thumbUrl || '';
      const statusLiveAssistirUnico = dadosLiveAssistirUnico.status || 'encerrada';
      tituloElementoAssistirUnico.innerText = tituloLiveAssistirUnico;
      descElementoAssistirUnico.innerText = descricaoLiveAssistirUnico;
//      if(metaViewsElementoAssistirUnico){ metaViewsElementoAssistirUnico.innerHTML = (dadosLiveAssistirUnico.views || 0) + ' visualizações <span></span> ' + (dadosLiveAssistirUnico.data || 'hoje'); }
      if(thumbLiveAssistirUnico){
        thumbElementoAssistirUnico.src = thumbLiveAssistirUnico;
        thumbElementoAssistirUnico.style.display = 'block';
        placeholderElementoAssistirUnico.style.display = 'none';
      }
      if(statusLiveAssistirUnico === 'ao_vivo'){
        badgeElementoAssistirUnico.innerHTML = '<div style="width:6px;height:6px;background:#FFF;border-radius:50%;"></div> AO VIVO';
        badgeElementoAssistirUnico.style.display = 'flex';
      } else {
        badgeElementoAssistirUnico.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"></rect><polygon points="10 8 16 12 10 16 10 8"></polygon></svg> VÍDEO';
        badgeElementoAssistirUnico.style.display = 'flex';
        badgeElementoAssistirUnico.style.background = '#0F1117';
      }
      const docCanalAssistirUnico = await dbAssistirUnico.collection('canais').doc(uidDonoAssistirUnico).get();
      if(docCanalAssistirUnico.exists){
        const dadosCanalAssistirUnico = docCanalAssistirUnico.data();
        const nomeCanalAssistirValorUnico = dadosCanalAssistirUnico.nomeCanal || 'Canal';
        const fotoCanalAssistirValorUnico = dadosCanalAssistirUnico.fotoURL || '';
        const handleCanalAssistirValorUnico = dadosCanalAssistirUnico.handle || '@' + nomeCanalAssistirValorUnico.toLowerCase();
        nomeCanalElementoAssistirUnico.innerText = nomeCanalAssistirValorUnico;
        document.getElementById('handle-canal-assistir-unico').innerText = handleCanalAssistirValorUnico;
        if(fotoCanalAssistirValorUnico){
          avatarCanalElementoAssistirUnico.innerHTML = '<img src="' + fotoCanalAssistirValorUnico + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
        } else {
          avatarCanalElementoAssistirUnico.innerText = nomeCanalAssistirValorUnico.charAt(0).toUpperCase();
        }
      }
    }catch(erroAssistirUnico){
      tituloElementoAssistirUnico.innerText = 'Erro ao carregar vídeo';
    }
  }

  document.addEventListener('DOMContentLoaded', function(){
    carregarVideoAssistirUnico();
  });
</script>

</body>
</html>
