<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chat App</title>
  <link id="app-favicon" rel="icon" type="image/png" href="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {background-color: #0F1117; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;}
    .login-card {background-color: #1E2230; border-radius: 24px; padding: 32px 24px; max-width: 400px; width: 100%; border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);}
    .icon-box {width: 70px; height: 70px; border-radius: 20px; background: linear-gradient(135deg, #0066FF 0%, #7C3AED 100%); display: flex; align-items: center; justify-content: center;}
    .login-card h2 { font-size: 22px; font-weight: 700; text-align: center; }
    .login-card p { color: #94A3B8; font-size: 13px; text-align: center; margin-top: -12px; }
    .input-group {width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left;}
    .input-group label { font-size: 12px; font-weight: 600; color: #94A3B8; }
    .input-wrapper {position: relative; display: flex; align-items: center;}
    .input-wrapper > svg:first-child {position: absolute; left: 14px; stroke: #94A3B8; pointer-events: none;}
    .input-wrapper input {width: 100%; background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px 14px 12px 42px; color: #FFFFFF; font-size: 14px; outline: none; font-family: inherit;}
    .input-wrapper input:focus {border-color: #0066FF;}
    .btn-login {width: 100%; background: linear-gradient(135deg, #0066FF 0%, #7C3AED 100%); color: #FFFFFF; border: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px;}
    .btn-back, .forgot-link {background: none; border: none; color: #94A3B8; font-size: 12px; cursor: pointer; text-decoration: none; transition: color 0.2s;}
    .btn-back:hover, .forgot-link:hover {color: #FFFFFF; text-decoration: underline;}
    .register-box {margin-top: 10px; font-size: 13px; color: #94A3B8; text-align: center;}
    .register-box a {color: #0066FF; font-weight: 600; text-decoration: none;}
    .register-box a:hover {text-decoration: underline;}
    /* ESTILOS DA TELA DE CARREGAMENTO (LOADING) */
    #loading-screen {position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(15, 17, 23, 0.85); backdrop-filter: blur(8px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; gap: 16px;}
    .astro-box {width: 130px; height: 130px; animation: floatAstro 2.5s ease-in-out infinite;}
    .loading-text {color: #94A3B8; font-size: 14px; font-weight: 600; letter-spacing: 0.5px;}
    @keyframes floatAstro {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(3deg); }
    }

  /* ICONE DE OLHO NO CAMPO SENHA */
  .btn-olho-senha-login-unico{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px;border-radius:6px;z-index:2}
  .btn-olho-senha-login-unico:active{opacity:0.7}
  #login-password{padding-right:44px !important}
  .btn-olho-senha-login-unico svg{position: static !important; left: auto !important; stroke: #94A3B8;}

  </style>
</head>
<body>

  <div class="login-card">
    <div class="icon-box">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="10 17 15 12 10 7"></polyline>
        <line x1="15" y1="12" x2="3" y2="12"></line>
      </svg>
    </div>

    <h2>Acesse sua Conta</h2>
    <p>Faça login para ter acesso completo ao chat, transmissões e ao seu perfil.</p>

    <form id="form-login" style="width: 100%; display: flex; flex-direction: column; gap: 16px;">
      
      <!-- Campo E-mail -->
      <div class="input-group">
        <label>E-mail</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" id="login-email" placeholder="seu@email.com" required>
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="input-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label>Senha</label>
          <a href="recuperar-senha.html" class="forgot-link">Esqueci a senha</a>
        </div>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="login-password" placeholder="••••••••" required>
          <button type="button" id="btnOlhoSenhaLoginUnico" class="btn-olho-senha-login-unico" onclick="alternarVisibilidadeSenhaLoginUnico()" aria-label="Mostrar senha">
            <span id="iconeOlhoSenhaLoginUnico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>

    <!-- Criar Cadastro -->
    <div class="register-box">
      Ainda não tem uma cadastro? <a href="cadastro.html">Cadastre-se Agora</a>
    </div>

    <button class="btn-back" onclick="window.location.href='inicio.html'">Voltar para o Início sem login</button>

  <!-- VERSAO -->
       <div style="margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 14px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);">
      <span style="font-size: 11px; color: #94A3B8; font-weight: 600; letter-spacing: 0.5px;">• Versão: 1.4.0 •</span>
    </div>

  <!-- TELA DE LOADING COM ASTRONAUTA -->
  <div id="loading-screen">
    <div class="astro-box">
      <svg viewBox="0 0 200 200" fill="none">
        <path d="M 60 145 Q 40 160 50 175 Q 70 165 75 145 Z" fill="#FF3B30" />
        <path d="M 62 148 Q 48 158 55 168 Q 68 160 72 148 Z" fill="#FFA100" />
        <rect x="55" y="105" width="30" height="45" rx="10" fill="url(#gradSplash)" transform="rotate(-25 55 105)" />
        <ellipse cx="100" cy="125" rx="32" ry="38" fill="#E2E8F0" />
        <ellipse cx="100" cy="125" rx="26" ry="32" fill="#FFFFFF" />
        <rect x="80" y="150" width="16" height="25" rx="8" fill="#CBD5E1" />
        <rect x="104" y="150" width="16" height="25" rx="8" fill="#CBD5E1" />
        <rect x="76" y="168" width="20" height="12" rx="6" fill="#7C3AED" />
        <rect x="104" y="168" width="20" height="12" rx="6" fill="#7C3AED" />
        <path d="M 70 115 Q 55 125 65 140" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round" fill="none" />
        <path d="M 130 115 Q 150 110 155 95" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round" fill="none" />
        <circle cx="156" cy="92" r="8" fill="#0066FF" />
        <circle cx="100" cy="75" r="38" fill="#FFFFFF" />
        <circle cx="100" cy="75" r="34" fill="#1E2230" />
        <ellipse cx="100" cy="75" rx="28" ry="20" fill="url(#gradSplash)" />
        <path d="M 82 65 Q 100 58 118 65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none" />
        <defs>
          <linearGradient id="gradSplash" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0066FF" />
            <stop offset="100%" stop-color="#7C3AED" />
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="loading-text">Entrando ...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp, collection, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDcX15UtgqteHH0MhCCZjZBbJkKNaoB61U",
      authDomain: "lobbz-a2e5b.firebaseapp.com",
      projectId: "lobbz-a2e5b",
      storageBucket: "lobbz-a2e5b.firebasestorage.app",
      messagingSenderId: "54068991558",
      appId: "1:54068991558:web:c4ccbe7ac3d53de0d80e07"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function fazerLogin(event) {
      event.preventDefault();
      document.getElementById('loading-screen').style.display = 'flex';

      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, senha);
        const user = userCredential.user;
        const uidLogadoLogin = user.uid;
        const agoraLoginMs = Date.now();
        localStorage.setItem('ultimo_login_' + uidLogadoLogin, agoraLoginMs.toString());
        await setDoc(doc(db, "usuarios", uidLogadoLogin), {
          ultimo_login: serverTimestamp()
        }, { merge: true });

        // Busca o documento do usuário diretamente pela ID (UID)
        const userDocRef = doc(db, "usuarios", user.uid);
        const docSnap = await getDoc(userDocRef);

        if (docSnap.exists()) {
          const dadosUsuario = docSnap.data();
          const nomeUsuario = dadosUsuario.nomeUsuario;
          const cadastroConcluido = dadosUsuario.cadastroConcluido;

          if (cadastroConcluido === false) {
            alert("Você ainda não concluiu seu cadastro. Vamos continuar de onde parou!");
            window.location.href = 'cadastro.html';
            return;
          }

          // Redireciona para o app incluindo o nome de usuário na URL
          window.location.href = `inicio.html?user=${nomeUsuario}`;
        } else {
          alert("Perfil de usuário não encontrado.");
        }
      } catch (error) {
        document.getElementById('loading-screen').style.display = 'none';
        alert("Erro ao fazer login: " + error.message);
      }
    }

    //===========================================
    //   FUNÇÃO DO OLHINHO NO CAMPO DA SENHA
    //===========================================
      window.alternarVisibilidadeSenhaLoginUnico = function(){
      const inputSenhaOlhoLoginUnico = document.getElementById('login-password');
      const spanIconeOlhoSenhaLoginUnico = document.getElementById('iconeOlhoSenhaLoginUnico');
      const svgOlhoAbertoLoginUnico = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      const svgOlhoFechadoLoginUnico = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.53 9.53a3 3 0 1 0 4.27 4.27"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      if(inputSenhaOlhoLoginUnico.type === 'password'){
        inputSenhaOlhoLoginUnico.type = 'text';
        spanIconeOlhoSenhaLoginUnico.innerHTML = svgOlhoFechadoLoginUnico;
      } else {
        inputSenhaOlhoLoginUnico.type = 'password';
        spanIconeOlhoSenhaLoginUnico.innerHTML = svgOlhoAbertoLoginUnico;
      }
    }

    //  FUNÇÃO DE ENTRAR COM ENTER
    const formLogin = document.getElementById('form-login');
    formLogin.addEventListener('submit', fazerLogin);
  </script>
<script type="module" src="appinfo.js"></script>
</body>
</html>
