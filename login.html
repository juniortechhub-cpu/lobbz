<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chat App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {background-color: #0F1117; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;}
    .login-card {background-color: #1E2230; border-radius: 24px; padding: 32px 24px; max-width: 400px; width: 100%; border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);}
    .icon-box {width: 70px; height: 70px; border-radius: 20px; background: linear-gradient(135deg, #0066FF 0%, #7C3AED 100%); display: flex; align-items: center; justify-content: center;}
    .login-card h2 { font-size: 22px; font-weight: 700; text-align: center; }
    .login-card p { color: #94A3B8; font-size: 13px; text-align: center; margin-top: -12px; }
    .input-group {width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left;}
    .input-group label { font-size: 12px; font-weight: 600; color: #94A3B8; }
    .input-wrapper {position: relative; display: flex; align-items: center;}
    .input-wrapper svg {position: absolute; left: 14px; stroke: #94A3B8;}
    .input-wrapper input {width: 100%; background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px 14px 12px 42px; color: #FFFFFF; font-size: 14px; outline: none; font-family: inherit;}
    .input-wrapper input:focus {border-color: #0066FF;}
    .btn-login {width: 100%; background: linear-gradient(135deg, #0066FF 0%, #7C3AED 100%); color: #FFFFFF; border: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px;}
    .btn-back, .forgot-link {background: none; border: none; color: #94A3B8; font-size: 12px; cursor: pointer; text-decoration: none; transition: color 0.2s;}
    .btn-back:hover, .forgot-link:hover {color: #FFFFFF; text-decoration: underline;}
    .register-box {margin-top: 10px; font-size: 13px; color: #94A3B8; text-align: center;}
    .register-box a {color: #0066FF; font-weight: 600; text-decoration: none;}
    .register-box a:hover {text-decoration: underline;}
  </style>
</head>
<body>

  <div class="login-card">
    <div class="icon-box">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="10 17 15 12 10 7"></polyline>
        <line x1="15" y1="12" x2="3" y2="12"></line>
      </svg>
    </div>

    <h2>Acesse sua Conta</h2>
    <p>Faça login para ter acesso completo ao chat, transmissões e ao seu perfil.</p>

    <form style="width: 100%; display: flex; flex-direction: column; gap: 16px;" onsubmit="fazerLogin(event)">
      
      <!-- Campo E-mail -->
      <div class="input-group">
        <label>E-mail</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" id="login-email" placeholder="seu@email.com" required>
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="input-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label>Senha</label>
          <a href="recuperar-senha.html" class="forgot-link">Esqueci a senha</a>
        </div>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>

    <!-- Criar Cadastro -->
    <div class="register-box">
      Ainda não tem uma cadastro? <a href="cadastro.html">Cadastre-se Agora</a>
    </div>

    <button class="btn-back" onclick="window.location.href='inicio.html'">Voltar para o Início sem login</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDcX15UtgqteHH0MhCCZjZBbJkKNaoB61U",
      authDomain: "lobbz-a2e5b.firebaseapp.com",
      projectId: "lobbz-a2e5b",
      storageBucket: "lobbz-a2e5b.firebasestorage.app",
      messagingSenderId: "54068991558",
      appId: "1:54068991558:web:c4ccbe7ac3d53de0d80e07"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function fazerLogin(event) {
      event.preventDefault();

      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, senha);
        const user = userCredential.user;

        // Busca o documento do usuário pelo campo uidAuth
        const q = query(collection(db, "usuarios"), where("uidAuth", "==", user.uid));
        const querySnapshot = await getDocs(q);

        if (!querySnapshot.empty) {
          let nomeUsuario = "";
          let cadastroConcluido = false;

          querySnapshot.forEach((docSnap) => {
            nomeUsuario = docSnap.data().nomeUsuario;
            cadastroConcluido = docSnap.data().cadastroConcluido;
          });

          if (cadastroConcluido === false) {
            alert("Você ainda não concluiu seu cadastro. Vamos continuar de onde parou!");
            window.location.href = 'cadastro.html';
            return;
          }

          // Redireciona para o app incluindo o nome de usuário na URL
          window.location.href = `inicio.html?user=${nomeUsuario}`;
        } else {
          alert("Perfil de usuário não encontrado.");
        }
      } catch (error) {
        alert("Erro ao fazer login: " + error.message);
      }
    }

    window.fazerLogin = fazerLogin;
  </script>

</body>
</html>
