<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview do Mascotes Ilustrado - Chat App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0F1117; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 800px; width: 100%; }
    h1 { font-size: 26px; text-align: center; margin-bottom: 6px; }
    p.subtitle { color: #94A3B8; text-align: center; margin-bottom: 32px; font-size: 14px; }

    .mascot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background-color: #1E2230; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); position: relative; text-align: center; }
    
    .badge { position: absolute; top: 16px; right: 16px; font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
    .badge-static { background-color: rgba(148, 163, 184, 0.2); color: #94A3B8; }
    .badge-animated { background: linear-gradient(135deg, #0066FF 0%, #7C3AED 100%); color: #FFFFFF; }

    .mascot-box { width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
    .mascot-box svg { width: 100%; height: 100%; }

    /* ANIMAÇÃO DE FLUTUAÇÃO */
    @keyframes floatAstro {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    .anim-float { animation: floatAstro 3.2s ease-in-out infinite; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Mascote Astronauta Completo</h1>
    <p class="subtitle">Ilustração com corpo inteiro, capacete e propulsor nas cores da marca</p>

    <div class="mascot-grid">
      <!-- Versão Parada -->
      <div class="card">
        <span class="badge badge-static">Parado</span>
        <div class="mascot-box">
          <svg viewBox="0 0 200 200" fill="none">
            <!-- Fogo do Foguete -->
            <path d="M 60 145 Q 40 160 50 175 Q 70 165 75 145 Z" fill="#FF3B30" />
            <path d="M 62 148 Q 48 158 55 168 Q 68 160 72 148 Z" fill="#FFA100" />
            
            <!-- Foguete / Mochila -->
            <rect x="55" y="105" width="30" height="45" rx="10" fill="url(#gradMarca)" transform="rotate(-25 55 105)" />
            
            <!-- Corpo / Macacão -->
            <ellipse cx="100" cy="125" rx="32" ry="38" fill="#E2E8F0" />
            <ellipse cx="100" cy="125" rx="26" ry="32" fill="#FFFFFF" />
            
            <!-- Pernas -->
            <rect x="80" y="150" width="16" height="25" rx="8" fill="#CBD5E1" />
            <rect x="104" y="150" width="16" height="25" rx="8" fill="#CBD5E1" />
            <!-- Botas -->
            <rect x="76" y="168" width="20" height="12" rx="6" fill="#7C3AED" />
            <rect x="104" y="168" width="20" height="12" rx="6" fill="#7C3AED" />

            <!-- Braços -->
            <path d="M 70 115 Q 55 125 65 140" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round" fill="none" />
            <path d="M 130 115 Q 150 110 155 95" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round" fill="none" />
            <!-- Luva acenando -->
            <circle cx="156" cy="92" r="8" fill="#0066FF" />

            <!-- Cabeça / Capacete -->
            <circle cx="100" cy="75" r="38" fill="#FFFFFF" />
            <circle cx="100" cy="75" r="34" fill="#1E2230" />
            <!-- Viseira com Gradiente -->
            <ellipse cx="100" cy="75" rx="28" ry="20" fill="url(#gradMarca)" />
            <!-- Brilho do Capacete -->
            <path d="M 82 65 Q 100 58 118 65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none" />
            
            <defs>
              <linearGradient id="gradMarca" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0066FF" />
                <stop offset="100%" stop-color="#7C3AED" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h3>Astronauta Estático</h3>
        <p style="font-size: 12px; color: #94A3B8;">Ideal para cartões de informação e telas fixas.</p>
      </div>

      <!-- Versão Em Movimento -->
      <div class="card">
        <span class="badge badge-animated">Em Movimento</span>
        <div class="mascot-box anim-float">
          <svg viewBox="0 0 200 200" fill="none">
            <!-- Fogo do Foguete -->
            <path d="M 60 145 Q 40 160 50 175 Q 70 165 75 145 Z" fill="#FF3B30" />
            <path d="M 62 148 Q 48 158 55 168 Q 68 160 72 148 Z" fill="#FFA100" />
            
            <!-- Foguete / Mochila -->
            <rect x="55" y="105" width="30" height="45" rx="10" fill="url(#gradMarca2)" transform="rotate(-25 55 105)" />
            
            <!-- Corpo / Macacão -->
            <ellipse cx="100" cy="125" rx="32" ry="38" fill="#E2E8F0" />
            <ellipse cx="100" cy="125" rx="26" ry="32" fill="#FFFFFF" />
            
            <!-- Pernas -->
            <rect x="80" y="150" width="16" height="25" rx="8" fill="#CBD5E1" />
            <rect x="104" y="150" width="16" height="25" rx="8" fill="#CBD5E1" />
            <!-- Botas -->
            <rect x="76" y="168" width="20" height="12" rx="6" fill="#7C3AED" />
            <rect x="104" y="168" width="20" height="12" rx="6" fill="#7C3AED" />

            <!-- Braços -->
            <path d="M 70 115 Q 55 125 65 140" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round" fill="none" />
            <path d="M 130 115 Q 150 110 155 95" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round" fill="none" />
            <!-- Luva acenando -->
            <circle cx="156" cy="92" r="8" fill="#0066FF" />

            <!-- Cabeça / Capacete -->
            <circle cx="100" cy="75" r="38" fill="#FFFFFF" />
            <circle cx="100" cy="75" r="34" fill="#1E2230" />
            <!-- Viseira com Gradiente -->
            <ellipse cx="100" cy="75" rx="28" ry="20" fill="url(#gradMarca2)" />
            <!-- Brilho do Capacete -->
            <path d="M 82 65 Q 100 58 118 65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none" />
            
            <defs>
              <linearGradient id="gradMarca2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0066FF" />
                <stop offset="100%" stop-color="#7C3AED" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h3>Astronauta Flutuando</h3>
        <p style="font-size: 12px; color: #94A3B8;">Animação perfeita para as telas de splash e carregamento.</p>
      </div>
    </div>

  </div>

</body>
</html>
