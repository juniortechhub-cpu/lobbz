<script>
const firebaseConfig = {

};
firebase.initializeApp(firebaseConfig);


const rtdbConfig = firebase.database();
let meuUIDConfig = null;
firebase.auth().onAuthStateChanged(function(userConfig){
if(!userConfig){ window.location.href='login.html'; return; }
meuUIDConfig = userConfig.uid;
});


async function irParaInicioComUidConfig(){
  const uidVoltarConfig = meuUIDConfig;
  if(!uidVoltarConfig){
    window.location.href = 'inicio.html';
    return;
  }
  try{
    const docVoltarConfig = await firebase.firestore().collection('usuarios').doc(uidVoltarConfig).get();
    if(docVoltarConfig.exists){
      const dadosVoltarConfig = docVoltarConfig.data();
      let nomeVoltarConfig = null;
      if(dadosVoltarConfig.handle){
        nomeVoltarConfig = dadosVoltarConfig.handle;
      } else if(dadosVoltarConfig.nomeUsuario){
        nomeVoltarConfig = dadosVoltarConfig.nomeUsuario;
      }
      if(nomeVoltarConfig){
        window.location.href = 'inicio.html?user=' + encodeURIComponent(nomeVoltarConfig);
        return;
      }
    }
    window.location.href = 'inicio.html?uid=' + uidVoltarConfig;
  } catch(e){
    window.location.href = 'inicio.html?uid=' + uidVoltarConfig;
  }
}


function fazerLogoutConfig(){
const uidLogoutConfig = meuUIDConfig;
if(uidLogoutConfig){ rtdbConfig.ref('status/' + uidLogoutConfig).set({state:'offline',last_changed:firebase.database.ServerValue.TIMESTAMP}); }
firebase.auth().signOut().then(function(){ window.location.href='inicio.html'; });
}

//    FUNÇÃO DE ABRIR A TELA MINHAS INFORMAÇÕES

function abrirMinhasInformacoes() {
  const menuPrincipal = document.getElementById('tab-menu-content');
  const subtelaInfo = document.getElementById('subtela-minhas-informacoes');
  
  if (menuPrincipal && subtelaInfo) {
    menuPrincipal.style.display = 'none';
    subtelaInfo.style.display = 'flex';
    carregarDadosUsuarioInfo();
  }
}

function fecharMinhasInformacoes() {
  const menuPrincipal = document.getElementById('tab-menu-content');
  const subtelaInfo = document.getElementById('subtela-minhas-informacoes');
  
  if (menuPrincipal && subtelaInfo) {
    subtelaInfo.style.display = 'none';
    menuPrincipal.style.display = 'flex';
  }
}

//====================================
//  FUNÇÃO DE CARREGAR E EDITAR INFORMAÇÕES DO USUARIO - FOTO E NOME DE USUARIO
//====================================
async function carregarDadosUsuarioInfo() {
  const uidUsuario = meuUIDConfig;
  if (!uidUsuario) return;

  try {
    const docUsuario = await firebase.firestore().collection('usuarios').doc(uidUsuario).get();
    if (docUsuario.exists) {
      const dadosUsuario = docUsuario.data();
      
      let valorNomeUsuario = '';
      if (dadosUsuario.nomeUsuario) {
        valorNomeUsuario = dadosUsuario.nomeUsuario;
      }
//   CALCULAR TEMPO PARA ALTERAÇÃO DE NOME DE USUARIO
      nomeUsuarioAtualDoBanco = valorNomeUsuario;
      try {
        const docConfigGeral = await firebase.firestore()
          .collection('usuarios')
          .doc(uidUsuario)
          .collection('configuracoes')
          .doc('geral')
          .get();

        if (docConfigGeral.exists) {
          const dadosConfig = docConfigGeral.data();
          historicoAlteracoesNome = dadosConfig.historicoAlteracoesNome;
          
          const agora = Date.now();
          const limite14DiasEmMs = 14 * 24 * 60 * 60 * 1000;
          
          const historicoRecente = historicoAlteracoesNome.filter(timestamp => (agora - timestamp) < limite14DiasEmMs);
          quantidadeAlteracoes14Dias = historicoRecente.length;
        } else {
          historicoAlteracoesNome = [];
          quantidadeAlteracoes14Dias = 0;
        }
      } catch (eConfig) {
        console.error('Erro ao ler subcoleção configuracoes:', eConfig);
      }

      const campoInput = document.getElementById('input-nome-usuario');
      if (campoInput) {
        campoInput.value = valorNomeUsuario;
      }

      if (dadosUsuario.fotoUrl || dadosUsuario.avatarUrl || dadosUsuario.foto) {
        const urlFoto = dadosUsuario.fotoUrl || dadosUsuario.avatarUrl || dadosUsuario.foto;
        const circuloFoto = document.getElementById('info-foto-circulo');
        const placeholderIcon = document.getElementById('info-foto-placeholder');
        
        if (circuloFoto) {
          circuloFoto.style.backgroundImage = 'url("' + urlFoto + '")';
        }
        if (placeholderIcon) {
          placeholderIcon.style.display = 'none';
        }
      }
    }
  } catch (erro) {
    console.error('Erro ao buscar informações do usuário:', erro);
  }
}

// EDITAR NOME DE USUARIO
function habilitarEdicaoNomeUsuario() {
  const campoInput = document.getElementById('input-nome-usuario');
  const msg = document.getElementById('username-msg-config');

  if (quantidadeAlteracoes14Dias >= 2) {
    if (msg) {
      msg.textContent = 'Você atingiu o limite de 2 alterações a cada 14 dias.';
      msg.style.display = 'block';
    }
    return;
  }

  if (campoInput) {
    campoInput.disabled = false;
    campoInput.focus();
    checarUsernameLiveConfig();
  }
}

// VARIÁVEL PARA GUARDAR A URL DA FOTO ATUAL DO USUÁRIO
let urlFotoAtualPerfil = null;

// RENDERIZA A FOTO OU A LETRA INICIAL DO NOME
function renderizarFotoOuInicial(urlFoto, nomeUsuario) {
  const circuloFoto = document.getElementById('info-foto-circulo');
  const placeholderIcon = document.getElementById('info-foto-placeholder');
  
  if (!circuloFoto) return;

  if (urlFoto) {
    urlFotoAtualPerfil = urlFoto;
    circuloFoto.style.backgroundImage = 'url("' + urlFoto + '")';
    if (placeholderIcon) placeholderIcon.style.display = 'none';
    circuloFoto.innerText = '';
  } else {
    urlFotoAtualPerfil = null;
    circuloFoto.style.backgroundImage = 'none';
    if (placeholderIcon) placeholderIcon.style.display = 'none';
    
    let letraInicial = 'U';
    if (nomeUsuario && nomeUsuario.length > 0) {
      letraInicial = nomeUsuario.charAt(0).toUpperCase();
    }
    
    circuloFoto.style.color = '#FFFFFF';
    circuloFoto.style.fontSize = '28px';
    circuloFoto.style.fontWeight = '700';
    circuloFoto.innerText = letraInicial;
  }
}

let historicoAlteracoesNome = [];
let quantidadeAlteracoes14Dias = 0;

// SUBTITUI O MÉTODO DE EXIBIÇÃO DENTRO DA FUNÇÃO EXISTENTE
const funcaoOriginalCarregarDados = carregarDadosUsuarioInfo;
carregarDadosUsuarioInfo = async function() {
  const uidUsuario = meuUIDConfig;
  if (!uidUsuario) return;

  try {
    const docUsuario = await firebase.firestore().collection('usuarios').doc(uidUsuario).get();
    if (docUsuario.exists) {
      const dadosUsuario = docUsuario.data();
      let valorNomeUsuario = dadosUsuario.nomeUsuario || '';
      nomeUsuarioAtualDoBanco = valorNomeUsuario;

      const campoInput = document.getElementById('input-nome-usuario');
      if (campoInput) campoInput.value = valorNomeUsuario;

      const urlFoto = dadosUsuario.fotoUrl || dadosUsuario.avatarUrl || dadosUsuario.foto || null;
      renderizarFotoOuInicial(urlFoto, valorNomeUsuario);
    }
  } catch (erro) {
    console.error('Erro ao buscar informações do usuário:', erro);
  }
};

// CONTROLE DE CLIQUE NO ÍCONE DE FOTO
function clicarFotoPerfil() {
  if (urlFotoAtualPerfil) {
    document.getElementById('modal-opcao-foto').style.display = 'flex';
  } else {
    escolherNovaFoto();
  }
}

function fecharModalOpcaoFoto() {
  document.getElementById('modal-opcao-foto').style.display = 'none';
}

function escolherNovaFoto() {
  fecharModalOpcaoFoto();
  document.getElementById('input-foto-oculto').click();
}

// PROCESSAR SELEÇÃO DA NOVA FOTO E ENVIAR PARA O FIREBASE STORAGE
async function processarSelecaoFoto(event) {
  const arquivo = event.target.files[0];
  if (!arquivo || !meuUIDConfig) return;

  const uidUsuario = meuUIDConfig;
  const storageRef = firebase.storage().ref();

  try {
    // 1. Se já tiver foto salva, exclui a foto antiga no Storage
    if (urlFotoAtualPerfil) {
      try {
        const fotoAntigaRef = firebase.storage().refFromURL(urlFotoAtualPerfil);
        await fotoAntigaRef.delete();
      } catch (eErroDelete) {
        console.warn('Foto antiga não encontrada no Storage ou já removida.');
      }
    }

    // 2. Salva na estrutura: usuarios > uid > nome_do_arquivo
    const caminhoStorage = 'usuarios/' + uidUsuario + '/' + Date.now() + '_' + arquivo.name;
    const refNovaFoto = storageRef.child(caminhoStorage);
    
    const snapshot = await refNovaFoto.put(arquivo);
    const downloadURL = await snapshot.ref.getDownloadURL();

    // 3. Atualiza o documento no Firestore
    await firebase.firestore().collection('usuarios').doc(uidUsuario).update({
      fotoUrl: downloadURL
    });

    // 4. Atualiza a interface da página com a nova foto
    renderizarFotoOuInicial(downloadURL, nomeUsuarioAtualDoBanco);

  } catch (erro) {
    console.error('Erro ao enviar foto de perfil:', erro);
  } finally {
    event.target.value = '';
  }
}

// CONFIRMAR E EXCLUIR A FOTO DE PERFIL
async function confirmarExclusaoFoto() {
  fecharModalOpcaoFoto();
  if (!meuUIDConfig || !urlFotoAtualPerfil) return;

  const uidUsuario = meuUIDConfig;

  try {
    // 1. Apaga do Firebase Storage
    try {
      const fotoAntigaRef = firebase.storage().refFromURL(urlFotoAtualPerfil);
      await fotoAntigaRef.delete();
    } catch (eErroDelete) {
      console.warn('Foto não encontrada no Storage para exclusão.');
    }

    // 2. Apaga a referência no Firestore
    await firebase.firestore().collection('usuarios').doc(uidUsuario).update({
      fotoUrl: firebase.firestore.FieldValue.delete(),
      avatarUrl: firebase.firestore.FieldValue.delete(),
      foto: firebase.firestore.FieldValue.delete()
    });

    // 3. Atualiza a tela exibindo a letra inicial do nome
    renderizarFotoOuInicial(null, nomeUsuarioAtualDoBanco);

  } catch (erro) {
    console.error('Erro ao excluir foto de perfil:', erro);
  }
}

//====================================
//   FUNÇÃO QUE BUSCA DISPONIBILIDADE DE USUARIO
//====================================
let usernameTimeoutConfig = null;
let nomeUsuarioAtualDoBanco = '';

async function checarUsernameLiveConfig() {
  clearTimeout(usernameTimeoutConfig);

  const inputUsuario = document.getElementById('input-nome-usuario');
  const loader = document.getElementById('loading-username-config');
  const msg = document.getElementById('username-msg-config');
  const checkIcon = document.getElementById('icon-username-check-config');
  const btnSalvar = document.getElementById('btn-salvar-username-config');

  if (!inputUsuario) return;

  const usernameDigitado = inputUsuario.value.trim().toLowerCase();

  msg.style.display = 'none';
  if (checkIcon) checkIcon.style.display = 'none';
  if (btnSalvar) btnSalvar.style.display = 'none';

  if (usernameDigitado.length === 0) {
    if (loader) loader.style.display = 'none';
    return;
  }

  // SE FOR O MESMO NOME QUE JÁ PERTENCE AO USUÁRIO LOGADO
  if (usernameDigitado === nomeUsuarioAtualDoBanco.toLowerCase()) {
    if (loader) loader.style.display = 'none';
    if (checkIcon) checkIcon.style.display = 'block';
    if (btnSalvar) btnSalvar.style.display = 'none';
    return;
  }

  const regexPermitido = /^[a-z0-9._]+$/;
  if (!regexPermitido.test(usernameDigitado)) {
    if (loader) loader.style.display = 'none';
    msg.textContent = 'Os nomes de usuário só podem incluir letras, números, pontos e sublinhados.';
    msg.style.display = 'block';
    if (btnSalvar) btnSalvar.style.display = 'none';
    return;
  }

  if (usernameDigitado.length < 3) {
    if (loader) loader.style.display = 'none';
    if (btnSalvar) btnSalvar.style.display = 'none';
    return;
  }

  if (loader) loader.style.display = 'block';

  usernameTimeoutConfig = setTimeout(async () => {
    try {
      const snapshot = await firebase.firestore()
        .collection('usuarios')
        .where('nomeUsuario', '==', usernameDigitado)
        .get();

      if (loader) loader.style.display = 'none';

      if (!snapshot.empty) {
        msg.textContent = 'Este nome de usuário já está em uso.';
        msg.style.display = 'block';
        if (checkIcon) checkIcon.style.display = 'none';
        if (btnSalvar) btnSalvar.style.display = 'none';
      } else {
        msg.style.display = 'none';
        if (checkIcon) checkIcon.style.display = 'block';
        if (btnSalvar) btnSalvar.style.display = 'flex';
      }
    } catch (erro) {
      if (loader) loader.style.display = 'none';
      if (btnSalvar) btnSalvar.style.display = 'none';
      console.error('Erro ao verificar nome de usuário:', erro);
    }
  }, 500);
}

//====================================================
// FUNÇÃO PARA SALVAR O NOVO NOME DE USUÁRIO
//====================================================
async function salvarNovoNomeUsuarioConfig() {
  const inputUsuario = document.getElementById('input-nome-usuario');
  const btnSalvar = document.getElementById('btn-salvar-username-config');
  const msg = document.getElementById('username-msg-config');
  const uidUsuario = meuUIDConfig;

  if (!inputUsuario || !uidUsuario) return;

  if (quantidadeAlteracoes14Dias >= 2) {
    if (msg) {
      msg.textContent = 'Você atingiu o limite de 2 alterações a cada 14 dias.';
      msg.style.display = 'block';
    }
    return;
  }

  const novoNome = inputUsuario.value.trim().toLowerCase();
  if (!novoNome) return;

  try {
    if (btnSalvar) btnSalvar.style.opacity = '0.5';

    const timestampAtual = Date.now();
    historicoAlteracoesNome.push(timestampAtual);

    const limite14DiasEmMs = 14 * 24 * 60 * 60 * 1000;
    const historicoRecente = historicoAlteracoesNome.filter(timestamp => (timestampAtual - timestamp) < limite14DiasEmMs);
    quantidadeAlteracoes14Dias = historicoRecente.length;

    // 1. Atualiza a coleção principal do usuário
    await firebase.firestore().collection('usuarios').doc(uidUsuario).update({
      nomeUsuario: novoNome
    });

    // 2. Registra o histórico e o contador na subcoleção: usuarios > uid > configuracoes > geral
    await firebase.firestore()
      .collection('usuarios')
      .doc(uidUsuario)
      .collection('configuracoes')
      .doc('geral')
      .set({
        historicoAlteracoesNome: historicoAlteracoesNome,
        quantidadeAlteracoes14Dias: quantidadeAlteracoes14Dias
      }, { merge: true });

    nomeUsuarioAtualDoBanco = novoNome;
    inputUsuario.disabled = true;

    if (btnSalvar) btnSalvar.style.display = 'none';
    if (btnSalvar) btnSalvar.style.opacity = '1';

  } catch (erro) {
    console.error('Erro ao salvar nome de usuário:', erro);
    if (btnSalvar) btnSalvar.style.opacity = '1';
  }
}
